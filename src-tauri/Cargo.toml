[package]
name = "minitrace"
version = "0.1.0"
description = "MiniTrace 世界 Online 微信小游戏明文流量采集桌面端"
authors = ["MiniTrace contributors"]
edition = "2021"

[lib]
name = "minitrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "minitrace"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2.5.1", features = ["test"] }
tauri-plugin-dialog = "2.2.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
